<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
        font-family: Arial, Helvetica, sans-serif;
        }
        a{
        color: rgb(8, 0, 255);
        text-decoration: none; /* para tirar o sublinhado dos links */
        font-weight: bold; /* para deixar os links em negrito */
        }
        a:visited{ /* pseudoclasse para quando usar o link , mudar de cor */
        color: rgb(255, 8, 8);
        }
        a:hover{/* ao passar o mouse em cima mudar a cor */
        color:greenyellow ;
        text-decoration: underline; /* aparecer o sublinhado */
        }
        a:active{ /* pseudoclasse para quando clica mudar a cor */
        color: purple;
        }
        a::after{/* pseudoELEMENTO */
      

        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>

</html>
